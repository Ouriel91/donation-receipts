name: Private operational data guard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  index-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m src.private_git_guard --repo . --history
